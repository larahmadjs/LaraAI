name: Build LARA AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Code
        run: |
          python3 - << 'EOF'
          import os

          files = {}

          # settings.gradle.kts
          files["android/settings.gradle.kts"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LaraAI"
          include(":app")
          """

          # root build.gradle.kts
          files["android/build.gradle.kts"] = """plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
              id("com.google.devtools.ksp") version "1.9.23-1.0.20" apply false
          }
          """

          # gradle.properties
          files["android/gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          """
          # app/build.gradle.kts
          files["android/app/build.gradle.kts"] = """plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.laraai.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.laraai.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  vectorDrawables { useSupportLibrary = true }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")

              implementation(platform("androidx.compose:compose-bom:2024.05.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")

              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-gson:2.11.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
          }
          """

          # AndroidManifest.xml
          files["android/app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:name=".LaraApplication"
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="LARA AI"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
          # Room: MessageEntity.kt
          files["android/app/src/main/java/com/laraai/app/data/local/MessageEntity.kt"] = """package com.laraai.app.data.local
          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "messages")
          data class MessageEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val sender: String,
              val content: String,
              val timestamp: Long = System.currentTimeMillis(),
              val isError: Boolean = false
          )
          """

          # Room: MessageDao.kt
          files["android/app/src/main/java/com/laraai/app/data/local/MessageDao.kt"] = """package com.laraai.app.data.local
          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.OnConflictStrategy
          import androidx.room.Query
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface MessageDao {
              @Query("SELECT * FROM messages ORDER BY timestamp ASC")
              fun getAllMessages(): Flow<List<MessageEntity>>

              @Query("SELECT * FROM messages ORDER BY timestamp DESC LIMIT :limit")
              suspend fun getRecentMessages(limit: Int): List<MessageEntity>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertMessage(message: MessageEntity): Long

              @Query("DELETE FROM messages")
              suspend fun clearAllMessages()
          }
          """

          # Room: AppDatabase.kt
          files["android/app/src/main/java/com/laraai/app/data/local/AppDatabase.kt"] = """package com.laraai.app.data.local
          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase

          @Database(entities = [MessageEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun messageDao(): MessageDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "lara_database"
                          ).fallbackToDestructiveMigration().build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          """

          # Preferences: AppPreferences.kt
          files["android/app/src/main/java/com/laraai/app/data/preferences/AppPreferences.kt"] = """package com.laraai.app.data.preferences
          import android.content.Context
          import androidx.datastore.preferences.core.booleanPreferencesKey
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map

          private val Context.dataStore by preferencesDataStore(name = "lara_prefs")

          class AppPreferences(private val context: Context) {
              companion object {
                  val SERVER_URL_KEY = stringPreferencesKey("server_url")
                  val DARK_THEME_KEY = booleanPreferencesKey("is_dark_theme")
                  const val DEFAULT_SERVER_URL = "https://lara-ai-backend.yoursubdomain.workers.dev"
              }
              val serverUrl: Flow<String> = context.dataStore.data.map { it[SERVER_URL_KEY] ?: DEFAULT_SERVER_URL }
              val isDarkTheme: Flow<Boolean> = context.dataStore.data.map { it[DARK_THEME_KEY] ?: true }

              suspend fun setServerUrl(url: String) { context.dataStore.edit { it[SERVER_URL_KEY] = url } }
              suspend fun setDarkTheme(enabled: Boolean) { context.dataStore.edit { it[DARK_THEME_KEY] = enabled } }
          }
          """
          # Retrofit: ApiModels.kt
          files["android/app/src/main/java/com/laraai/app/data/remote/ApiModels.kt"] = """package com.laraai.app.data.remote
          import com.google.gson.annotations.SerializedName

          data class ChatMessage(@SerializedName("role") val role: String, @SerializedName("content") val content: String)
          data class ChatRequest(@SerializedName("messages") val messages: List<ChatMessage>)
          data class ChatResponse(@SerializedName("reply") val reply: String?, @SerializedName("status") val status: String?)
          data class HealthResponse(@SerializedName("status") val status: String)
          """

          # Retrofit: LaraApiService.kt
          files["android/app/src/main/java/com/laraai/app/data/remote/LaraApiService.kt"] = """package com.laraai.app.data.remote
          import retrofit2.Response
          import retrofit2.http.Body
          import retrofit2.http.GET
          import retrofit2.http.POST

          interface LaraApiService {
              @POST("chat")
              suspend fun sendMessage(@Body request: ChatRequest): Response<ChatResponse>
              @GET("health")
              suspend fun checkHealth(): Response<HealthResponse>
          }
          """

          # Retrofit: RetrofitClient.kt
          files["android/app/src/main/java/com/laraai/app/data/remote/RetrofitClient.kt"] = """package com.laraai.app.data.remote
          import okhttp3.OkHttpClient
          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import java.util.concurrent.TimeUnit

          object RetrofitClient {
              private var currentUrl = ""
              private var service: LaraApiService? = null

              fun getService(baseUrl: String): LaraApiService {
                  val sanitized = if (baseUrl.endsWith("/")) baseUrl else "$baseUrl/"
                  if (service == null || currentUrl != sanitized) {
                      currentUrl = sanitized
                      val client = OkHttpClient.Builder()
                          .connectTimeout(30, TimeUnit.SECONDS)
                          .readTimeout(60, TimeUnit.SECONDS)
                          .build()
                      service = Retrofit.Builder()
                          .baseUrl(sanitized)
                          .client(client)
                          .addConverterFactory(GsonConverterFactory.create())
                          .build()
                          .create(LaraApiService::class.java)
                  }
                  return service!!
              }
          }
          """

          # Repository: ChatRepository.kt
          files["android/app/src/main/java/com/laraai/app/data/repository/ChatRepository.kt"] = """package com.laraai.app.data.repository
          import com.laraai.app.data.local.MessageDao
          import com.laraai.app.data.local.MessageEntity
          import com.laraai.app.data.preferences.AppPreferences
          import com.laraai.app.data.remote.ChatMessage
          import com.laraai.app.data.remote.ChatRequest
          import com.laraai.app.data.remote.RetrofitClient
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first

          class ChatRepository(private val messageDao: MessageDao, private val prefs: AppPreferences) {
              val allMessages: Flow<List<MessageEntity>> = messageDao.getAllMessages()

              suspend fun sendMessage(userText: String): Result<String> {
                  messageDao.insertMessage(MessageEntity(sender = "USER", content = userText))
                  return try {
                      val url = prefs.serverUrl.first()
                      val api = RetrofitClient.getService(url)
                      val history = messageDao.getRecentMessages(10).reversed().map {
                          ChatMessage(role = if (it.sender == "USER") "user" else "assistant", content = it.content)
                      }
                      val response = api.sendMessage(ChatRequest(messages = history))
                      if (response.isSuccessful && response.body()?.reply != null) {
                          val reply = response.body()!!.reply!!
                          messageDao.insertMessage(MessageEntity(sender = "LARA", content = reply))
                          Result.success(reply)
                      } else {
                          val err = "يا هلا، صار خلل بسيط بالاتصال بالسيرفر، جرب كمان شوي!"
                          messageDao.insertMessage(MessageEntity(sender = "LARA", content = err, isError = true))
                          Result.failure(Exception(err))
                      }
                  } catch (e: Exception) {
                      val err = "معلش تأكد من اتصال الإنترنت عندك، مش قادرة أوصل للشبكة!"
                      messageDao.insertMessage(MessageEntity(sender = "LARA", content = err, isError = true))
                      Result.failure(Exception(err))
                  }
              }

              suspend fun clearHistory() = messageDao.clearAllMessages()
              suspend fun testConnection(): Boolean = try {
                  RetrofitClient.getService(prefs.serverUrl.first()).checkHealth().isSuccessful
              } catch (e: Exception) { false }
          }
          """
          # UI Theme
          files["android/app/src/main/java/com/laraai/app/ui/theme/Color.kt"] = """package com.laraai.app.ui.theme
          import androidx.compose.ui.graphics.Color
          val BackgroundNavy = Color(0xFF090610)
          val SurfaceCard = Color(0xFF130E22)
          val NeonPurple = Color(0xFFA855F7)
          val VibrantPurple = Color(0xFF7C3AED)
          val TextWhite = Color(0xFFF9FAFB)
          val TextMuted = Color(0xFF9CA3AF)
          """

          files["android/app/src/main/java/com/laraai/app/ui/theme/Theme.kt"] = """package com.laraai.app.ui.theme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable

          private val DarkColors = darkColorScheme(
              primary = NeonPurple,
              secondary = VibrantPurple,
              background = BackgroundNavy,
              surface = SurfaceCard,
              onPrimary = TextWhite,
              onBackground = TextWhite,
              onSurface = TextWhite
          )

          @Composable
          fun LaraAITheme(darkTheme: Boolean = true, content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColors, content = content)
          }
          """

          # ViewModels
          files["android/app/src/main/java/com/laraai/app/ui/viewmodel/ChatViewModel.kt"] = """package com.laraai.app.ui.viewmodel
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.laraai.app.data.local.MessageEntity
          import com.laraai.app.data.repository.ChatRepository
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch

          class ChatViewModel(private val repository: ChatRepository) : ViewModel() {
              val messages: StateFlow<List<MessageEntity>> = repository.allMessages.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              private val _isThinking = MutableStateFlow(false)
              val isThinking: StateFlow<Boolean> = _isThinking.asStateFlow()

              fun sendMessage(text: String) {
                  if (text.isBlank()) return
                  viewModelScope.launch {
                      _isThinking.value = true
                      repository.sendMessage(text.trim())
                      _isThinking.value = false
                  }
              }
          }
          """

          files["android/app/src/main/java/com/laraai/app/ui/viewmodel/SettingsViewModel.kt"] = """package com.laraai.app.ui.viewmodel
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.laraai.app.data.preferences.AppPreferences
          import com.laraai.app.data.repository.ChatRepository
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch

          class SettingsViewModel(private val prefs: AppPreferences, private val repo: ChatRepository) : ViewModel() {
              val currentUrl: StateFlow<String> = prefs.serverUrl.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), AppPreferences.DEFAULT_SERVER_URL)
              val isDarkTheme: StateFlow<Boolean> = prefs.isDarkTheme.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), true)
              private val _connStatus = MutableStateFlow<Boolean?>(null)
              val connStatus: StateFlow<Boolean?> = _connStatus.asStateFlow()

              fun setUrl(url: String) { viewModelScope.launch { prefs.setServerUrl(url) } }
              fun checkConn() { viewModelScope.launch { _connStatus.value = repo.testConnection() } }
              fun clearHistory() { viewModelScope.launch { repo.clearHistory() } }
          }
          """

          # Screens
          files["android/app/src/main/java/com/laraai/app/ui/screens/SplashScreen.kt"] = """package com.laraai.app.ui.screens
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.laraai.app.ui.theme.NeonPurple
          import kotlinx.coroutines.delay

          @Composable
          fun SplashScreen(onDone: () -> Unit) {
              val scale = remember { Animatable(0.8f) }
              LaunchedEffect(Unit) {
                  scale.animateTo(1.1f, infiniteRepeatable(tween(1000), RepeatMode.Reverse))
              }
              LaunchedEffect(Unit) {
                  delay(2200)
                  onDone()
              }
              Box(modifier = Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background), contentAlignment = Alignment.Center) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(
                          modifier = Modifier.size(110.dp).scale(scale.value)
                              .border(3.dp, NeonPurple, CircleShape).background(NeonPurple.copy(alpha = 0.2f), CircleShape),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("LARA", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                      }
                      Spacer(Modifier.height(20.dp))
                      Text("LARA AI", fontSize = 26.sp, fontWeight = FontWeight.Bold, color = Color.White)
                      Text("مساعدتك الذكية بلمسة أردنية 🇯🇴", fontSize = 15.sp, color = NeonPurple)
                  }
              }
          }
          """
          files["android/app/src/main/java/com/laraai/app/ui/screens/ChatScreen.kt"] = """package com.laraai.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.Send
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.laraai.app.ui.theme.NeonPurple
          import com.laraai.app.ui.theme.TextMuted
          import com.laraai.app.ui.theme.VibrantPurple
          import com.laraai.app.ui.viewmodel.ChatViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChatScreen(viewModel: ChatViewModel, onSettings: () -> Unit) {
              val messages by viewModel.messages.collectAsState()
              val isThinking by viewModel.isThinking.collectAsState()
              var input by remember { mutableStateOf("") }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("لارا (LARA AI) 🇯🇴") },
                          actions = {
                              IconButton(onClick = onSettings) {
                                  Icon(Icons.Default.Settings, contentDescription = "الإعدادات")
                              }
                          }
                      )
                  },
                  bottomBar = {
                      Row(
                          modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surface).padding(8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          OutlinedTextField(
                              value = input,
                              onValueChange = { input = it },
                              modifier = Modifier.weight(1f),
                              placeholder = { Text("احكي معي شو ما بدك...") },
                              shape = RoundedCornerShape(20.dp)
                          )
                          Spacer(Modifier.width(8.dp))
                          IconButton(
                              onClick = {
                                  if (input.isNotBlank() && !isThinking) {
                                      viewModel.sendMessage(input)
                                      input = ""
                                  }
                              },
                              modifier = Modifier.background(Brush.linearGradient(listOf(NeonPurple, VibrantPurple)), CircleShape)
                          ) {
                              Icon(Icons.AutoMirrored.Filled.Send, contentDescription = "إرسال", tint = Color.White)
                          }
                      }
                  }
              ) { padding ->
                  Column(modifier = Modifier.fillMaxSize().padding(padding).padding(12.dp)) {
                      LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(messages) { msg ->
                              val isUser = msg.sender == "USER"
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(if (isUser) VibrantPurple else MaterialTheme.colorScheme.surface)
                                          .padding(12.dp)
                                  ) {
                                      Text(msg.content, color = Color.White)
                                  }
                              }
                          }
                          if (isThinking) {
                              item {
                                  Text("لارا بتفكر...", color = NeonPurple, fontSize = 13.sp)
                              }
                          }
                      }
                  }
              }
          }
          """

          files["android/app/src/main/java/com/laraai/app/ui/screens/SettingsScreen.kt"] = """package com.laraai.app.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import com.laraai.app.ui.viewmodel.SettingsViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SettingsScreen(viewModel: SettingsViewModel, onBack: () -> Unit) {
              val currentUrl by viewModel.currentUrl.collectAsState()
              var urlText by remember(currentUrl) { mutableStateOf(currentUrl) }
              val connStatus by viewModel.connStatus.collectAsState()

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("الإعدادات") },
                          navigationIcon = {
                              IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") }
                          }
                      )
                  }
              ) { padding ->
                  Column(modifier = Modifier.fillMaxSize().padding(padding).padding(16.dp)) {
                      Text("رابط الخادم السحابي (Cloudflare Worker):")
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(
                          value = urlText,
                          onValueChange = { urlText = it; viewModel.setUrl(it) },
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(12.dp))
                      Button(onClick = { viewModel.checkConn() }) {
                          Text("فحص الاتصال")
                      }
                      connStatus?.let {
                          Text(if (it) "الاتصال سليم 100%!" else "فشل الاتصال بالسيرفر", color = if (it) Color.Green else Color.Red)
                      }
                      Spacer(Modifier.height(24.dp))
                      Button(
                          onClick = { viewModel.clearHistory() },
                          colors = ButtonDefaults.buttonColors(containerColor = Color.Red)
                      ) {
                          Text("مسح سجل الرسائل")
                      }
                  }
              }
          }
          """

          # App & Activity
          files["android/app/src/main/java/com/laraai/app/LaraApplication.kt"] = """package com.laraai.app
          import android.app.Application
          import com.laraai.app.data.local.AppDatabase
          import com.laraai.app.data.preferences.AppPreferences
          import com.laraai.app.data.repository.ChatRepository

          class LaraApplication : Application() {
              lateinit var preferences: AppPreferences
              lateinit var chatRepository: ChatRepository
              override fun onCreate() {
                  super.onCreate()
                  val db = AppDatabase.getDatabase(this)
                  preferences = AppPreferences(this)
                  chatRepository = ChatRepository(db.messageDao(), preferences)
              }
          }
          """

          files["android/app/src/main/java/com/laraai/app/MainActivity.kt"] = """package com.laraai.app
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.laraai.app.ui.screens.*
          import com.laraai.app.ui.theme.LaraAITheme
          import com.laraai.app.ui.viewmodel.ChatViewModel
          import com.laraai.app.ui.viewmodel.SettingsViewModel

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val app = application as LaraApplication
                  val chatVm = ChatViewModel(app.chatRepository)
                  val settingsVm = SettingsViewModel(app.preferences, app.chatRepository)

                  setContent {
                      LaraAITheme {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                              val nav = rememberNavController()
                              NavHost(navController = nav, startDestination = "splash") {
                                  composable("splash") {
                                      SplashScreen(onDone = {
                                          nav.navigate("chat") { popUpTo("splash") { inclusive = true } }
                                      })
                                  }
                                  composable("chat") {
                                      ChatScreen(chatVm, onSettings = { nav.navigate("settings") })
                                  }
                                  composable("settings") {
                                      SettingsScreen(settingsVm, onBack = { nav.popBackStack() })
                                  }
                              }
                          }
                      }
                  }
              }
          }
          """

          for path, content in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          print("All project source files generated successfully!")
          EOF

      - name: Build APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaraAI-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
