          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import com.laraai.app.ui.viewmodel.SettingsViewModel

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun SettingsScreen(viewModel: SettingsViewModel, onBack: () -> Unit) {
              val currentUrl by viewModel.currentUrl.collectAsState()
              var urlText by remember(currentUrl) { mutableStateOf(currentUrl) }
              val connStatus by viewModel.connStatus.collectAsState()

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("الإعدادات") },
                          navigationIcon = {
                              IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "رجوع") }
                          }
                      )
                  }
              ) { padding ->
                  Column(modifier = Modifier.fillMaxSize().padding(padding).padding(16.dp)) {
                      Text("رابط الخادم السحابي (Cloudflare Worker):")
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(
                          value = urlText,
                          onValueChange = { urlText = it; viewModel.setUrl(it) },
                          modifier = Modifier.fillMaxWidth()
                      )
                      Spacer(Modifier.height(12.dp))
                      Button(onClick = { viewModel.checkConn() }) {
                          Text("فحص الاتصال")
                      }
                      connStatus?.let {
                          Text(if (it) "الاتصال سليم 100%!" else "فشل الاتصال بالسيرفر", color = if (it) Color.Green else Color.Red)
                      }
                      Spacer(Modifier.height(24.dp))
                      Button(
                          onClick = { viewModel.clearHistory() },
                          colors = ButtonDefaults.buttonColors(containerColor = Color.Red)
                      ) {
                          Text("مسح سجل الرسائل")
                      }
                  }
              }
          }
