                              shape = RoundedCornerShape(20.dp)
                          )
                          Spacer(Modifier.width(8.dp))
                          IconButton(
                              onClick = {
                                  if (input.isNotBlank() && !isThinking) {
                                      viewModel.sendMessage(input)
                                      input = ""
                                  }
                              },
                              modifier = Modifier.background(Brush.linearGradient(listOf(NeonPurple, VibrantPurple)), CircleShape)
                          ) {
                              Icon(Icons.AutoMirrored.Filled.Send, contentDescription = "إرسال", tint = Color.White)
                          }
                      }
                  }
              ) { padding ->
                  Column(modifier = Modifier.fillMaxSize().padding(padding).padding(12.dp)) {
                      LazyColumn(modifier = Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(messages) { msg ->
                              val isUser = msg.sender == "USER"
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(12.dp))
                                          .background(if (isUser) VibrantPurple else MaterialTheme.colorScheme.surface)
                                          .padding(12.dp)
                                  ) {
                                      Text(msg.content, color = Color.White)
                                  }
                              }
                          }
                          if (isThinking) {
                              item {
                                  Text("لارا بتفكر...", color = NeonPurple, fontSize = 13.sp)
                              }
                          }
                      }
                  }
              }
          }
          """

          files["android/app/src/main/java/com/laraai/app/ui/screens/SettingsScreen.kt"] = """package com.laraai.app.ui.screens
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
